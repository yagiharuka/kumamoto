name: Update Kumamoto AEON Watch

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the 30-minute email report"
        required: false
        default: true
        type: boolean
      trigger:
        description: "Dispatch source"
        required: false
        default: "manual"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update.yml"
      - "scripts/**"
      - "tests/**"
      - "docs/index.html"
      - "docs/styles.css"
      - "docs/app.js"
      - "docs/.nojekyll"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kumamoto-aeon-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      collection_outcome: ${{ steps.collect.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect latest coverage
        id: collect
        continue-on-error: true
        run: python scripts/collect.py

      - name: Email update report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.send_email }}
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/send_email.py

      - name: Stop after a collection failure
        if: ${{ steps.collect.outcome != 'success' }}
        run: exit 1

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json docs/data/news.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh news data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: collect
    if: ${{ needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
