name: Resend corrected JST email once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/resend-jst-email-once.yml"

permissions:
  contents: read

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recreate the last hourly email window
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          state_path = Path("data/email_state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          last_sent = state.get("last_sent_at")
          if not last_sent:
              raise SystemExit("No previous hourly email is available to resend.")

          sent_at = datetime.fromisoformat(last_sent.replace("Z", "+00:00"))
          sent_at = sent_at.astimezone(timezone.utc)
          window_start = sent_at - timedelta(hours=1)
          news = json.loads(Path("data/news.json").read_text(encoding="utf-8"))

          result = {
              "status": "ok",
              "run_at": sent_at.isoformat(timespec="seconds").replace("+00:00", "Z"),
              "run_at_jst": sent_at.astimezone(ZoneInfo("Asia/Tokyo")).strftime(
                  "%Y/%m/%d %H:%M JST"
              ),
              "total_count": len(news.get("items", [])),
              "warnings": [],
          }
          Path(".work").mkdir(exist_ok=True)
          Path(".work/update_result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          resend_state = {
              "schema_version": 1,
              "last_checked_at": window_start.isoformat(timespec="seconds").replace(
                  "+00:00", "Z"
              ),
              "last_sent_at": last_sent,
          }
          state_path.write_text(
              json.dumps(resend_state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Send corrected email
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/send_email.py
